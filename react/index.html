<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#800020" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F0E0E" media="(prefers-color-scheme: dark)" />
    <!-- ROUTE-HEAD -->
    <title>Baptiste Grosjean — CV</title>
    <meta name="description" content="Baptiste Grosjean — interactive CV." />
    <!-- /ROUTE-HEAD -->
    <script>
      // Apply the stored theme before first paint (same key as /js/theme.js).
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {
        console.warn('Theme preference unreadable, following the system:', error);
      }
    </script>
    <!-- Chrome and Edge prepare the classic page on the way to its link in the views
         bar. Not this app's own displays: those are routes, switched without a load. -->
    <script type="speculationrules">
    {"prerender":[{"where":{"and":[{"selector_matches":".views-bar-link"},{"not":{"href_matches":"/app/*"}},{"not":{"href_matches":"/*.xml"}}]},"eagerness":"moderate"}]}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A page drawn at build time shows the timeline zoomed in: open it on
      // today, as the app does, before the first paint.
      for (const frame of document.querySelectorAll('.timeline-scroll')) {
        frame.scrollLeft = frame.scrollWidth;
      }
    </script>
    <!-- Without JavaScript the drawn page is all there is: show the whole career
         rather than a zoomed timeline that cannot be scrolled to today. -->
    <noscript><style>.timeline-grid { width: 100% !important; }</style></noscript>
    <noscript>This view needs JavaScript — the <a href="/">classic CV</a> does not.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
