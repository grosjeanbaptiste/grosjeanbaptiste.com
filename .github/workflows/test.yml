name: Tests

# Runs the whole suite on every push and pull request.
#
# Deliberately no `paths:` filter. The tests read the stylesheets, the generated
# HTML, the self-hosted fonts, the resume data, the LaTeX build config and the
# other workflow files — close to the whole repository. A filter narrow enough
# to be worth writing would be narrower than that dependency set, which is
# exactly how the regeneration workflow came to never fire on a stylesheet edit.
# The suite takes well under a minute; that is cheaper than the class of bug a
# filter invites.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # print-fit.test.js prints the six localized pages with a real browser and
      # asserts the CV still comes out on two sheets. Report the version up
      # front so a runner image that drops Chrome fails here, with an obvious
      # cause, rather than inside the suite.
      # Both engines, on purpose: they paginate the same stylesheet differently
      # and a Chrome-only check once passed while the site printed four pages in
      # Firefox. Report the versions up front so a runner image that drops one
      # fails here, with an obvious cause, rather than inside the suite.
      - name: Browsers for the print-fit tests
        run: |
          google-chrome --version
          firefox --version

      # xslt-print.test.js renders the XSLT theme with xsltproc. It is not on the
      # runner image, and without it those tests fail as six ENOENTs rather than
      # being skipped — install it so they actually run.
      - name: XSLT processor for the theme tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xsltproc

      - name: Test suite
        run: npm test
