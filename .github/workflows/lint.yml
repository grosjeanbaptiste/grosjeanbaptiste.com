name: Lint

on:
  push:
    branches: [master]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/*.json'
      - 'biome.json'
      - 'package.json'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/*.json'
      - 'biome.json'
      - 'package.json'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Biome (lint + format check)
        run: npx --yes @biomejs/biome@1.9.4 ci .
      - name: Line-count check (max 200, .js/.mjs/.ts/.tsx/.css)
        run: node scripts/check-line-count.js
